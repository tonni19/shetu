[pytest]
# Tests live in backend/tests. `pythonpath = backend` lets every test import the backend as
# `app...` (the same name uvicorn uses: `uvicorn app.main:app` from backend/), whether pytest
# runs from the repository root (as CI does) or from backend/. See AGENTS.md, "Project layout".
testpaths = backend/tests
pythonpath = backend
