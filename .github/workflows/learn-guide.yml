# Publishes ONLY the learning guide (docs/learn) to GitHub Pages.
# Never widen the path: the rest of docs/ holds course material that must not be public.
# A GitHub Pages site is public even though this repository is private.
name: Publish the learning guide

on:
  push:
    branches: [main]
    paths: ["docs/learn/**", ".github/workflows/learn-guide.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/learn
      - id: deployment
        uses: actions/deploy-pages@v4
