# CI: runs every test on each pull request, and on every push to main.
# OWNER: Nazha (board row T4). Maruf adjusted the triggers and install step on 2026-11-24.
# It used to run on every push to every branch, so each pull request ran twice. Now: once per
# pull request, plus once when something lands on main.
name: CI

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]

# Cancel an older run of the same branch when a newer commit arrives.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install dependencies
        # requirements-dev.txt includes requirements.txt (the app) and the test tools.
        run: pip install -r backend/requirements-dev.txt
      - name: Run pytest from the repository root
        # pytest.ini sets testpaths and pythonpath, so no `cd backend` is needed.
        run: python -m pytest -v
